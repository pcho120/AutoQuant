name: News collection and analysis

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */8 * * *"

concurrency:
  group: autoquant-data-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
      COLLECTION_TICKERS: ${{ vars.COLLECTION_TICKERS }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Collect news
        id: news
        continue-on-error: true
        run: python -m jobs.runner collect_news
      - name: Analyze unprocessed news
        id: analysis
        continue-on-error: true
        run: python -m jobs.runner analyze_unprocessed_news
      - name: Report collection failure
        if: always() && (steps.news.outcome == 'failure' || steps.analysis.outcome == 'failure')
        run: exit 1